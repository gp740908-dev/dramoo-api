# nginx/dramoo.conf
# Konfigurasi Nginx untuk Dramoo API
# Salin ke: /etc/nginx/sites-available/dramoo
# Lalu: ln -s /etc/nginx/sites-available/dramoo /etc/nginx/sites-enabled/

# Rate limiting zone (di luar server block)
limit_req_zone $binary_remote_addr zone=dramoo_api:10m rate=100r/s;

# Upstream ke Node.js
upstream dramoo_backend {
    server 127.0.0.1:3000;
    keepalive 64;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name api.dramoo.id dramoo.id www.dramoo.id;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS - API Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.dramoo.id;

    # SSL (Certbot akan mengisi ini otomatis)
    ssl_certificate     /etc/letsencrypt/live/api.dramoo.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.dramoo.id/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Powered-By "Dramoo API" always;

    # Logging
    access_log /var/log/nginx/dramoo_access.log combined;
    error_log  /var/log/nginx/dramoo_error.log warn;

    # Gzip
    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 1024;

    # Client limits
    client_max_body_size 2M;
    client_body_timeout 12;
    client_header_timeout 12;
    send_timeout 10;

    # Rate limiting untuk endpoint umum
    limit_req zone=dramoo_api burst=200 nodelay;
    limit_req_status 429;

    # Health check (tanpa log)
    location /health {
        proxy_pass http://dramoo_backend;
        access_log off;
        proxy_set_header Host $host;
    }

    # Logos static files (cache agresif)
    location /logos/ {
        proxy_pass http://dramoo_backend;
        proxy_cache_valid 200 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        expires 7d;
    }

    # API Routes
    location / {
        proxy_pass http://dramoo_backend;

        # Proxy headers
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_http_version 1.1;

        # Timeout
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;

        # Cache untuk endpoint publik
        location /api/status {
            proxy_pass http://dramoo_backend;
            proxy_cache_valid 200 30s;
            add_header Cache-Control "public, max-age=30";
        }

        location /api/packages {
            proxy_pass http://dramoo_backend;
            proxy_cache_valid 200 5m;
            add_header Cache-Control "public, max-age=300";
        }
    }

    # Block akses langsung ke admin dari luar (opsional — bisa di-IP restrict)
    # location /admin/ {
    #     allow 1.2.3.4;  # IP kamu
    #     deny all;
    #     proxy_pass http://dramoo_backend;
    # }
}
